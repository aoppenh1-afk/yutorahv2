name: Refresh public catalog snapshots
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-public-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRENDING_SITE_URL: ${{ vars.TRENDING_SITE_URL }}
      TRENDING_REFRESH_TOKEN: ${{ secrets.TRENDING_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Refresh collection snapshots, cover manifest and teacher rankings
        run: node scripts/warm-catalog.mjs --url "$TRENDING_SITE_URL" --collections 12 --teachers 4 --max-minutes 6
