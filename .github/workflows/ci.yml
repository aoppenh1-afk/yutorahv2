name: Validate application and notes coordinator
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://worker_test:worker_test@127.0.0.1:5432/worker_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run test:content
      - run: npm run test:notes-only
      - run: npm run test:notes-export
      - run: npm run test:notes-vm
      - run: npm run test:maintenance
      - run: npm run test:sources
      - run: npm run test:search
      - run: npm run test:parity
      - run: npm run test:learning
      - run: npm run test:account-library
      - run: npm run test:notifications
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Check notification Edge Function
        working-directory: /tmp
        run: deno check --no-config --node-modules-dir=manual "$GITHUB_WORKSPACE/supabase/functions/notify-shiurim/index.ts"
      - run: npm run performance:fixtures
      - run: npm run test:performance
      - run: npm run test:api
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run performance:budgets
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:player
      - run: npm run test:mobile-sheet
      - run: npm run test:catalog-browser
      - run: npm run test:navigation
      - run: npm run test:downloads
      - run: npm run build:vercel
      - run: npm run performance:budgets -- .vercel/output/static
