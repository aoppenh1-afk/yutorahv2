<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI refinements</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#182229);font:14px/1.55 var(--font-sans,system-ui),sans-serif}p{color:var(--muted-foreground,#637078);margin:0 0 20px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 0 20px}label{display:flex;align-items:center;gap:8px}select{border:1px solid var(--border,#d5dde0);border-radius:8px;background:var(--card,white);color:var(--foreground,#182229);font:inherit;padding:8px 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair.large{grid-template-columns:1fr}figure{margin:0;border:1px solid var(--border,#d5dde0);border-radius:10px;overflow:hidden;background:var(--card,white)}figcaption{font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border,#d5dde0)}img{width:100%;height:auto;display:block}.phone{max-width:390px;margin:auto}@media(max-width:630px){.pair{grid-template-columns:1fr}}</style></head><body><p>Actual Chrome screenshots. Topic filters follow the requested order, collection portraits use the larger images, and learning statistics are removed. Individual learned controls remain.</p><div class="controls"><label>View <select id="view" onchange="show()"><option>Topics</option><option>Collection portrait & statistics</option><option>Home statistics</option><option>Preferences</option></select></label><label>Size <select id="size" onchange="show()"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select></label><label><input type="checkbox" onchange="document.querySelector('.pair').classList.toggle('large',this.checked)"> Enlarge images</label></div><div class="pair"><figure><figcaption>Before</figcaption><img id="before" src="/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-before-desktop.jpg" alt="Topics before the update"></figure><figure><figcaption>After</figcaption><img id="after" src="/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-after-desktop.jpg" alt="Topics after the update"></figure></div><script>const captures={"Topics": {"desktop": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-before-desktop.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-after-desktop.jpg"], "mobile": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-before-mobile.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/topics-after-mobile.jpg"]}, "Collection portrait & statistics": {"desktop": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/collection-before-desktop.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/collection-after-desktop.jpg"], "mobile": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/collection-before-mobile.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/collection-after-mobile.jpg"]}, "Home statistics": {"mobile": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/daily-before-mobile.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/daily-after-mobile.jpg"]}, "Preferences": {"desktop": ["/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/preferences-before-desktop.jpg", "/Users/sender/Projects/YU Torah/work/ui-polish-20261013/screenshots/preferences-after-desktop.jpg"]}};function show(){const view=document.getElementById('view').value,size=document.getElementById('size');size.disabled=Object.keys(captures[view]).length===1;if(!captures[view][size.value])size.value=Object.keys(captures[view])[0];const files=captures[view][size.value];['before','after'].forEach((id,i)=>{const img=document.getElementById(id);img.src=files[i];img.alt=view+' '+id;img.parentElement.classList.toggle('phone',size.value==='mobile')})}</script></body></html>
